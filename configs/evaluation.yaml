# =============================================================================
# evaluation.yaml — métricas, incerteza, testes estatísticos e ablation.
#
# Regra do projeto: nenhuma métrica é reportada como número solto. Toda
# métrica principal vem com intervalo de confiança, e toda afirmação de
# "modelo A é melhor que B" vem acompanhada de teste de significância.
# =============================================================================

metrics:
  primary: f1_macro
  compute:
    - accuracy
    - precision_macro
    - recall_macro
    - f1_macro
    - f1_weighted
    - roc_auc_ovr
    - pr_auc_macro
    - mcc
  per_class: true                 # precision/recall/F1 por classe
  # Recall da classe `ideacao_suicida` é reportado em destaque: é a métrica
  # com maior custo clínico associado a falso negativo.
  highlight:
    - recall_ideacao_suicida
    - pr_auc_ideacao_suicida

# --- Incerteza --------------------------------------------------------------
uncertainty:
  method: bootstrap               # bootstrap | cv_std
  n_bootstrap: 1000
  confidence_level: 0.95
  random_state: 42

# --- Calibração -------------------------------------------------------------
# As probabilidades são usadas para priorizar triagem humana, então precisam
# ser calibradas — não basta a ordenação estar correta.
calibration:
  enabled: true
  n_bins: 10
  metrics: [brier_score, expected_calibration_error]
  reliability_curve: true

# --- Testes estatísticos ----------------------------------------------------
statistics:
  # Comparação par a par no MESMO conjunto de teste (mesmos usuários).
  mcnemar:
    enabled: true
    correction: true
  # Comparação par a par entre folds da validação cruzada.
  wilcoxon:
    enabled: true
    alternative: two-sided
  # Comparação de múltiplos modelos entre folds.
  friedman:
    enabled: true
    posthoc: nemenyi
  alpha: 0.05
  # Correção para múltiplas comparações — sem ela, comparar ~8 modelos
  # praticamente garante um "significativo" por acaso.
  multiple_comparison_correction: holm
  # Tamanho de efeito acompanha o p-valor (significância != relevância).
  effect_size: cliffs_delta

# --- Avaliação por fatias ---------------------------------------------------
# Não há atributos demográficos coletados (minimização de dados / LGPD), então
# as fatias são comportamentais. Métrica agregada esconde falha em subgrupo.
slices:
  enabled: true
  definitions:
    volume_tweets:
      column: n_tweets
      bins: [30, 100, 300, 1000, .inf]
      labels: [baixo, medio, alto, muito_alto]
    janela_observacao:
      column: span_days
      bins: [0, 90, 180, 365, .inf]
      labels: [curta, media, longa, muito_longa]
    atividade_noturna:
      column: night_activity_ratio
      bins: [0.0, 0.1, 0.3, 1.0]
      labels: [baixa, media, alta]
  min_samples_per_slice: 20
  # Alerta se a diferença de F1 entre a melhor e a pior fatia exceder:
  max_acceptable_gap: 0.15

# --- Ablation Study ---------------------------------------------------------
# Remove um grupo de atributos por vez do modelo híbrido, medindo o delta na
# métrica principal — é o que testa H2, H3 e H4 diretamente.
ablation:
  enabled: true
  base_model: hybrid_xgboost
  groups:
    - linguistic
    - emotional
    - semantic
    - temporal
    - behavioral
    - psychological
  mode: leave_one_out             # leave_one_out | only_one | both
  # Também roda cada grupo isolado, para separar contribuição marginal de
  # contribuição absoluta (um grupo pode ser redundante mas não inútil).
  include_only_one: true
  n_repeats: 5

# --- Comparação tweet-level vs. user-level (H5) -----------------------------
granularity_comparison:
  enabled: true
  # Mesmo modelo, mesmas features, mudando apenas a unidade de decisão.
  tweet_level_aggregation: majority_vote
  models: [xgboost, bertimbau]

# --- Interpretabilidade -----------------------------------------------------
interpretability:
  shap:
    enabled: true
    explainer: tree               # tree | kernel | linear
    max_display: 25
    sample_size: 500              # subamostra para o KernelExplainer
    random_state: 42
  permutation_importance:
    enabled: true
    n_repeats: 10
    random_state: 42
    scoring: f1_macro

# --- Regressão de métrica (teste de CI) -------------------------------------
# Se o F1-macro do modelo híbrido cair abaixo disso, o build falha.
regression_thresholds:
  hybrid_xgboost:
    f1_macro: 0.70
  xgboost:
    f1_macro: 0.65

# --- Relatórios -------------------------------------------------------------
reporting:
  formats: [json, csv, md]
  figure_formats: [png, svg]
  figure_dpi: 300
  save_predictions: true
  generate_model_card: true
