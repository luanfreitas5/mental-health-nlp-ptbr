# =============================================================================
# model_params.yaml — hiperparâmetros por modelo.
#
# Escopo (Proposta, "Modelos Avaliados"):
#   comparison  -> comparação principal, escopo garantido da dissertação (H1–H5)
#   exploratory -> extensão exploratória, roda apenas com `--include-exploratory`
#
# `baseline` é obrigatório e roda sempre: sem um benchmark simples não há como
# afirmar que a complexidade adicional trouxe ganho real.
#
# --- Ajustes para GPU Tesla V100S-PCIE-32GB (Volta, CUDA 12.4) --------------
# 32 GB de HBM2 sobram para os modelos deste projeto (BERT-base/mDeBERTa-base,
# BiLSTM, XGBoost), então os `batch_size` foram aumentados em relação a um
# ajuste pensado para GPUs de 8-16 GB — menos passos de otimizador por época,
# treino mais rápido, sem trocar a arquitetura nem a semântica do experimento.
# Volta (sm_70) tem Tensor Cores de FP16 (o que justifica `fp16: true`), mas
# NÃO tem suporte nativo a BF16/TF32 (isso é Ampere+) — por isso o projeto
# usa FP16 com `GradScaler`, nunca BF16, ao mexer no laço de treino.
# =============================================================================

# --- Baseline (sempre executado) --------------------------------------------
baseline:
  dummy:
    scope: baseline
    estimator: dummy
    params:
      strategy: stratified
      random_state: 42
  tfidf_logistic:
    scope: baseline
    estimator: logistic_regression
    feature_groups: [linguistic]     # só TF-IDF + léxico: referência de H1
    params:
      C: 1.0
      max_iter: 2000
      class_weight: balanced
      random_state: 42

# --- Machine Learning tradicional -------------------------------------------
traditional:
  xgboost:
    scope: comparison
    estimator: xgboost
    params:
      n_estimators: 600
      max_depth: 6
      learning_rate: 0.05
      subsample: 0.8
      colsample_bytree: 0.8
      min_child_weight: 3
      reg_lambda: 1.0
      objective: multi:softprob
      eval_metric: mlogloss
      tree_method: hist
      # XGBoost >= 2.x: `device: cuda` acelera o `tree_method: hist` na GPU
      # (substitui o antigo `gpu_hist`). O dataset é tabular e pequeno
      # (poucas centenas/milhares de usuários), então o ganho é modesto, mas
      # a V100S está ociosa neste estágio do pipeline — sem custo usar.
      device: cuda
      random_state: 42
      n_jobs: -1
  logistic_regression:
    scope: exploratory
    estimator: logistic_regression
    params:
      C: 1.0
      max_iter: 2000
      class_weight: balanced
      random_state: 42
  random_forest:
    scope: exploratory
    estimator: random_forest
    params:
      n_estimators: 500
      max_depth: null
      min_samples_leaf: 2
      class_weight: balanced_subsample
      random_state: 42
      n_jobs: -1
  lightgbm:
    scope: exploratory
    estimator: lightgbm
    params:
      n_estimators: 600
      num_leaves: 31
      learning_rate: 0.05
      subsample: 0.8
      colsample_bytree: 0.8
      class_weight: balanced
      random_state: 42
      # device_type: gpu não é definido aqui de propósito — o wheel padrão do
      # PyPI (`pip install lightgbm`) não é compilado com suporte a GPU; ligar
      # isso sem uma build customizada (CUDA/OpenCL) derruba o treino.
      n_jobs: -1
      verbose: -1

# --- Deep Learning ----------------------------------------------------------
deep:
  bilstm:
    scope: comparison
    estimator: bilstm
    params:
      embedding_dim: 300
      hidden_dim: 128
      num_layers: 2
      bidirectional: true
      dropout: 0.3
      max_tweets_per_user: 200      # sequência de tweets do usuário
      max_length: 64
      learning_rate: 0.001
      # As sequências (batch, 200, dim_embedding) cabem folgadas na V100S de
      # 32 GB; 16 era dimensionado para GPUs pequenas (~4-8 GB). Lote maior
      # satura melhor o paralelismo da GPU.
      batch_size: 64
      epochs: 30
      patience: 5
      random_state: 42
  lstm:
    scope: exploratory
    estimator: bilstm
    params:
      hidden_dim: 128
      num_layers: 1
      bidirectional: false
      dropout: 0.3
      learning_rate: 0.001
      batch_size: 64
      epochs: 30
      patience: 5
      random_state: 42
  cnn_text:
    scope: exploratory
    estimator: cnn_text
    params:
      embedding_dim: 300
      num_filters: 128
      kernel_sizes: [3, 4, 5]
      dropout: 0.5
      learning_rate: 0.001
      batch_size: 64
      epochs: 30
      patience: 5
      random_state: 42

# --- Transformers -----------------------------------------------------------
transformer:
  bertimbau:
    scope: comparison
    estimator: transformer
    params:
      model_name: neuralmind/bert-base-portuguese-cased
      max_length: 128
      # Agrega os tweets do usuário: classifica cada tweet e agrega as
      # probabilidades (mais estável e mais barato que fine-tune hierárquico).
      user_aggregation: mean
      learning_rate: 2.0e-5
      # BERT-base + FP16 em max_length=128 cabe folgado em 32 GB; lote maior
      # reduz o tempo de fine-tuning sem precisar acumular gradiente.
      batch_size: 64
      epochs: 4
      warmup_ratio: 0.1
      weight_decay: 0.01
      gradient_accumulation_steps: 1
      fp16: true              # Tensor Cores FP16 da Volta (sm_70)
      random_state: 42
  roberta:
    scope: exploratory
    estimator: transformer
    params:
      model_name: pucpr/biobertpt-all
      max_length: 128
      learning_rate: 2.0e-5
      batch_size: 32
      epochs: 4
      fp16: true
      random_state: 42
  deberta:
    scope: exploratory
    estimator: transformer
    params:
      model_name: microsoft/mdeberta-v3-base
      max_length: 128
      learning_rate: 2.0e-5
      batch_size: 16
      epochs: 4
      # fp16 deliberadamente OMITIDO: a atenção desentrelaçada do DeBERTa é
      # conhecida por overflow numérico em FP16 puro (sem BF16 disponível na
      # Volta para compensar). Rodar em FP32 é mais seguro que arriscar NaN
      # no meio de um treino de horas.
      random_state: 42

# --- LLM open-source (Ollama) — ver llm.yaml --------------------------------
llm:
  ollama_primary:
    scope: comparison
    estimator: llm
    params:
      # Modelo definido em teste piloto (Proposta): sobrescreva aqui.
      model: llama3.2
      mode: few_shot               # zero_shot | few_shot
      n_examples: 3
      temperature: 0.0
      max_tweets_per_prompt: 20
  gemma:
    scope: exploratory
    estimator: llm
    params:
      model: gemma2
      mode: few_shot
      temperature: 0.0
  mistral:
    scope: exploratory
    estimator: llm
    params:
      model: mistral
      mode: few_shot
      temperature: 0.0

# --- Modelo híbrido proposto (principal contribuição) -----------------------
# Embeddings do Transformer + atributos emocionais/temporais/comportamentais +
# vetor psicológico do LLM -> XGBoost. Ver docs/guides/architecture.md.
hybrid:
  hybrid_xgboost:
    scope: comparison
    estimator: hybrid
    feature_groups:
      - semantic
      - emotional
      - temporal
      - behavioral
      - psychological
      - linguistic
    params:
      head: xgboost
      n_estimators: 800
      max_depth: 6
      learning_rate: 0.03
      subsample: 0.8
      colsample_bytree: 0.7
      min_child_weight: 3
      reg_lambda: 2.0
      objective: multi:softprob
      eval_metric: mlogloss
      tree_method: hist
      device: cuda
      random_state: 42
      n_jobs: -1

# --- Tratamento de desbalanceamento -----------------------------------------
class_imbalance:
  strategy: class_weight          # class_weight | none | smote
  # SMOTE não é aplicado a embeddings por padrão: interpolar vetores semânticos
  # cria "usuários" que não existem e infla a métrica de validação.
